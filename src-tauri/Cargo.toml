[package]
name = "hpbar"
version = "0.8.0"
description = "HP Bar — Claude subscription usage in your menu bar / tray"
authors = ["MadCreeper"]
edition = "2021"
rust-version = "1.77"

# The Tauri 2 convention: a lib crate holds the app (so mobile targets can reuse
# it) and a thin main.rs calls into it. We only ship desktop, but keep the shape.
[lib]
name = "hpbar_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Dev-only (examples/tests): PNG compositing for the tray-icon preview. Already in
# the lock via Tauri, so this adds no new download and never ships in the binary.
[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
# Native low/critical-quota notifications (Ambient HP). Official Tauri plugin.
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls so we don't depend on the system OpenSSL — keeps Linux builds simple.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros", "net"] }
# Team sharing talks to a self-hosted Postgres over an SSH tunnel. NoTls — the
# tunnel encrypts — so no OpenSSL, matching the rustls-only stance above.
# with-chrono-0_4 lets us bind NaiveDate/DateTime params as real date/timestamptz.
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Keychain access is macOS-only; Linux/Windows read a plaintext file instead.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# Attribute-only Keychain queries (no item data → no ACL password prompt), used
# to tell whether Claude Code rewrote its credential item since our last read.
# Already in the tree via keyring, so it adds no new download.
security-framework = "3"
# Native NSVisualEffectView backdrop for the "liquid glass" prototype (Tier 1).
window-vibrancy = "0.5"
# Reach the WKWebView to clear its opaque underPageBackgroundColor (see lib.rs),
# and NSGlassEffectView for the real Liquid Glass (macOS 26+). objc2-foundation
# is already in the tree via wry, so it adds no new download.
objc2 = "0.5"
objc2-foundation = { version = "0.2", default-features = false, features = ["NSGeometry"] }

[profile.release]
opt-level = "s"   # optimise for size — this is a tiny menu-bar utility
lto = true
strip = true
