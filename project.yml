name: HPBar
options:
  bundleIdPrefix: com.sunjichen
  deploymentTarget:
    macOS: "14.0"
targets:
  HPBar:
    type: application
    platform: macOS
    sources:
      - path: HPBar
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.sunjichen.hpbar
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_LSUIElement: YES
      CODE_SIGN_IDENTITY: "HPBar Dev"
      CODE_SIGN_STYLE: Manual
      SWIFT_VERSION: "6.0"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    dependencies:
      - package: HPBarKit
packages:
  HPBarKit:
    path: HPBarKit
