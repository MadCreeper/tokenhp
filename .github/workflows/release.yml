# Cross-platform release builds. Triggered by tags like `v0.2.0`.
# Produces .app/.dmg (macOS, universal), .deb/.rpm/.AppImage (Linux), and
# .msi/.exe (Windows), attached to a published prerelease (alpha).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - platform: windows-latest
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the annotated-tag object so release notes can read its message

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file wget

      - name: Install frontend dependencies
        run: npm ci

      # Use the annotated tag's message as the release notes (its body is the
      # changelog), with the install caveat appended. Falls back to just the
      # caveat if the tag has no message.
      - name: Release notes from tag
        shell: bash
        run: |
          {
            echo 'RELEASE_BODY<<RELEASE_EOF'
            git tag -l --format='%(contents)' "${{ github.ref_name }}"
            printf '\n---\nCross-platform build (macOS · Linux · Windows). Unsigned; see the README for install caveats.\n'
            echo 'RELEASE_EOF'
          } >> "$GITHUB_ENV"

      - name: Build + release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "HPBar ${{ github.ref_name }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
