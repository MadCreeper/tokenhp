# Cross-platform builds. Only tags like `v0.2.0` publish releases.
# Produces .app/.dmg (macOS, universal), .deb/.rpm/.AppImage (Linux), and
# .msi/.exe (Windows). A tag with a prerelease suffix (`-beta`, `-alpha`) is
# published as a GitHub prerelease; a plain `vX.Y.Z` tag is a full release —
# matching the in-app updater's Stable/Beta/Alpha channels.
name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - '.github/workflows/release.yml'
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - 'public/**'
      - 'index.html'
      - 'package*.json'
      - '*config*'
  workflow_dispatch:

# Superseded branch builds can stop; each release tag always finishes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - platform: windows-latest
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the annotated-tag object so release notes can read its message

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Tags can restore main's cache, but cannot restore other tags' caches.
          # Build the same targets/profile on main so future releases start warm.
          # rust-cache also keys by compiler, environment and dependency inputs.
          # Cache keys reject commas, so label the universal target set explicitly.
          shared-key: release-${{ matrix.platform }}-${{ matrix.platform == 'macos-latest' && 'universal' || '' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file wget

      - name: Validate release version
        if: github.ref_type == 'tag'
        run: node scripts/release-version.mjs

      - name: Install frontend dependencies
        run: npm ci

      # Use the annotated tag's message as the release notes (its body is the
      # changelog), with the install caveat appended. Falls back to just the
      # caveat if the tag has no message.
      - name: Release notes from tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          # actions/checkout resolves the tag to a SHA and leaves a *lightweight*
          # tag behind, and `%(contents)` on a lightweight tag silently falls
          # back to the commit message — which is how v0.7.0-beta shipped with
          # its commit message as the release notes. Re-fetch the real tag
          # object first, and fail loudly rather than publish the wrong text.
          git fetch --force --tags origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          if [ "$(git cat-file -t "${{ github.ref_name }}")" != "tag" ]; then
            echo "::error::${{ github.ref_name }} is not an annotated tag — release notes would be the commit message. Re-tag with 'git tag -a'."
            exit 1
          fi
          {
            echo 'RELEASE_BODY<<RELEASE_EOF'
            git tag -l --format='%(contents)' "${{ github.ref_name }}"
            printf '\n---\nCross-platform build (macOS · Linux · Windows). Unsigned; see the README for install caveats.\n'
            echo 'RELEASE_EOF'
          } >> "$GITHUB_ENV"

      # Exercise actual packaging while warming the default-branch cache. With
      # no tagName/releaseId, tauri-action builds without publishing a release.
      - name: Build packages
        if: github.ref_type != 'tag'
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }} -- --locked

      - name: Build + release
        if: github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "HPBar ${{ github.ref_name }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          # Prerelease iff the tag carries a suffix (e.g. -beta, -alpha).
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }} -- --locked

      - name: Keep test installers
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: HPBar-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error
          path: |
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/nsis/*-setup.exe
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/deb/*.deb
            src-tauri/target/**/bundle/rpm/*.rpm
            src-tauri/target/**/bundle/appimage/*.AppImage
