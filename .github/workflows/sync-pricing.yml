name: Sync model pricing

on:
  schedule:
    # Daily at 04:23 UTC (off-peak minute to avoid top-of-hour runner queues).
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      force_pr:
        description: 'Open a PR instead of auto-committing to main'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-pricing
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: pricing-sync-linux

      - name: Sync pricing table from upstream registries
        run: |
          node scripts/sync-pricing.mjs \
            --write \
            --summary-file /tmp/pricing-summary.md \
            --meta-file /tmp/pricing-meta.json
          cat /tmp/pricing-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect pricing diff
        id: diff
        run: |
          if git diff --quiet -- src-tauri/src/pricing.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "needs_review=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            NEEDS_REVIEW=$(node -e 'const m = JSON.parse(require("fs").readFileSync("/tmp/pricing-meta.json","utf8")); console.log(m.needs_review ? "true" : "false")')
            if [ "${{ inputs.force_pr }}" = "true" ]; then
              NEEDS_REVIEW="true"
            fi
            echo "needs_review=$NEEDS_REVIEW" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate JS pricing sync tests
        if: steps.diff.outputs.changed == 'true'
        run: node --test tests/pricing-sync.test.mjs

      - name: Validate Rust pricing tests
        if: steps.diff.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib pricing

      - name: Auto-commit safe pricing update to main
        if: steps.diff.outputs.changed == 'true' && steps.diff.outputs.needs_review == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/pricing.json src-tauri/src/pricing-sources.json
          git commit -m "chore(pricing): sync model rates [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Open or update PR for review-gated pricing change
        if: steps.diff.outputs.changed == 'true' && steps.diff.outputs.needs_review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="chore/sync-pricing"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add src-tauri/src/pricing.json src-tauri/src/pricing-sources.json
          git commit -m "chore(pricing): sync model rates (review required)"
          git push --force origin "$BRANCH"

          TITLE="chore(pricing): sync model rates (review required)"
          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --title "$TITLE" --body-file /tmp/pricing-summary.md
          else
            gh pr create --base "${{ github.ref_name }}" --head "$BRANCH" --title "$TITLE" --body-file /tmp/pricing-summary.md
          fi
