name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Test, Build, Package
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcode-select -p

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Run unit tests (swift test, HPBarKit)
        run: swift test --package-path HPBarKit

      - name: Generate Xcode project
        run: xcodegen generate

      # CI runners don't have the developer's "HPBar Dev" code-signing
      # identity, so override to ad-hoc signing for the build. The released
      # binary is unsigned-for-distribution — users must right-click → Open
      # (or run `xattr -dr com.apple.quarantine HPBar.app`) the first time.
      - name: Build app (Release, ad-hoc signed)
        run: |
          xcodebuild \
            -project HPBar.xcodeproj \
            -scheme HPBar \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package as zip
        run: |
          APP="build/Build/Products/Release/HPBar.app"
          test -d "$APP" || { echo "App not found"; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent "$APP" HPBar.zip
          ls -lh HPBar.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HPBar
          path: HPBar.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: HPBar.zip
          generate_release_notes: true
          # Mark `-alpha` / `-beta` / `-rc` tags as prereleases automatically.
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          body: |
            ## Install (macOS 14 / 15)

            1. Download `HPBar.zip`, double-click to unzip → `HPBar.app`.
            2. Drag `HPBar.app` to `/Applications`.
            3. **Bypass Gatekeeper** — this build is not notarized, so macOS
               will refuse it first. Pick one:

               **Terminal (works on every macOS, easiest):**
               ```bash
               xattr -dr com.apple.quarantine /Applications/HPBar.app
               ```

               **System Settings (macOS Sequoia 15):**
               - Try to open `HPBar.app` → macOS shows "blocked" dialog.
               - **System Settings → Privacy & Security**, scroll to the
                 "Security" block → click **"Open Anyway"** next to HPBar.
               - Confirm the next prompt.

               *(Right-click → Open no longer works on Sequoia — Apple
               removed that shortcut for unsigned apps.)*

            4. Launch HPBar. A bolt ⚡ icon appears in the menu bar.
            5. The first read of Claude Code's Keychain credential will
               prompt for your login password — click **"Always Allow"**.

            ### See full README

            [README on GitHub](https://github.com/MadCreeper/tokenhp#readme) —
            themes, pricing customization, build from source.
